name: Coverage
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    name: Windows LLVM coverage
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Generate coverage summary
        run: cargo llvm-cov --locked --all-targets --all-features --summary-only
