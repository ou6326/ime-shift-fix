name: CI
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  lint:
    name: Static quality gate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Documentation
        run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
  test:
    name: Windows x64 Rust ${{ matrix.toolchain }}
    runs-on: windows-2025
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.85.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test event sequences
        run: cargo test --locked --all-targets --all-features
  package:
    name: Build and verify crate
    runs-on: windows-2025
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build release
        run: cargo build --locked --release
      - name: Smoke test CLI
        shell: pwsh
        run: |
          $help = & ./target/release/ime-shift-fix.exe --help
          if ($LASTEXITCODE -ne 0 -or "$help" -notmatch 'Usage:') { throw 'Help smoke test failed' }
          & ./target/release/ime-shift-fix.exe --invalid-option
          if ($LASTEXITCODE -ne 2) { throw 'Invalid arguments must exit with code 2' }
          exit 0
      - name: Package and verify crate
        run: cargo package --locked
  coverage:
    name: Windows coverage
    needs: lint
    uses: ./.github/workflows/coverage.yml
  ci-success:
    name: All checks passed
    runs-on: ubuntu-24.04
    if: always()
    needs: [lint, test, package, coverage]
    steps:
      - name: Verify all upstream jobs succeeded
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $JOB_RESULTS; do
            if [ "$result" != "success" ]; then
              echo "One or more CI jobs did not succeed: $JOB_RESULTS"
              exit 1
            fi
          done
